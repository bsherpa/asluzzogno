<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A.S. Luzzogno · Calcio a 7</title>
<meta name="description" content="A.S. Luzzogno – calendario, risultati, rosa e classifica del campionato CSI VCO calcio a 7.">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AS Luzzogno">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="media/icon-192.png">
<link rel="apple-touch-icon" href="media/icon-180.png">
<meta property="og:title" content="A.S. Luzzogno">
<meta property="og:description" content="Calendario, risultati e classifica – CSI VCO calcio a 7">
<meta property="og:image" content="media/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --orange:#E8742A; --orange-d:#C95E1C; --black:#111; --ink:#1b1b1b;
  --bg:#f4f2ef; --card:#fff; --muted:#6f6a64; --line:#e6e1da;
  --win:#1f9d55; --draw:#9a8f84; --loss:#d64545;
  --r:16px; --disp:Oswald,'Arial Narrow','Roboto Condensed',Inter,system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:64px}
body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.4}
a{color:inherit}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
h1,h2,h3,.oswald{font-family:var(--disp);letter-spacing:.02em;text-transform:uppercase}

/* HERO */
.hero{background:var(--black);color:#fff;position:relative;overflow:hidden;padding:calc(env(safe-area-inset-top) + 28px) 0 64px}
.hero::before{content:"";position:absolute;inset:auto -20% -40% 35%;height:140%;background:var(--orange);transform:skewX(-24deg);opacity:.95}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:6px;background:repeating-linear-gradient(90deg,var(--orange) 0 24px,#fff 24px 30px)}
.hero .wrap{position:relative;display:flex;align-items:center;gap:18px}
.crest{width:104px;height:104px;border-radius:50%;background:#fff;flex:none;box-shadow:0 8px 24px rgba(0,0,0,.35);padding:4px}
.crest img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.hero h1{font-size:32px;line-height:1;font-weight:700}
.hero .sub{margin-top:8px;font-size:13px;opacity:.9;font-weight:500}
.hero .since{display:inline-block;margin-top:10px;font-family:var(--disp);font-size:12px;letter-spacing:.2em;border:1px solid rgba(255,255,255,.5);border-radius:99px;padding:3px 10px}
.ig{display:inline-flex;align-items:center;gap:6px;margin:10px 0 0 6px;font-size:12px;font-weight:600;text-decoration:none;background:#fff;color:var(--black);border-radius:99px;padding:4px 10px}
.ig[hidden]{display:none}

/* CARDS */
.cards{margin-top:-40px;position:relative;display:grid;gap:12px}
.card{background:var(--card);border-radius:var(--r);box-shadow:0 2px 14px rgba(0,0,0,.07);padding:16px}
.label{font-family:var(--disp);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--orange-d);font-weight:600}
.next .teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin:12px 0 10px;text-align:center}
.next .team{font-family:var(--disp);font-weight:600;font-size:17px;line-height:1.15;text-transform:uppercase}
.next .team.us{color:var(--orange-d)}
.next .vs{font-family:var(--disp);color:var(--muted);font-size:14px}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);justify-content:center}
.meta b{color:var(--ink);font-weight:600}
.countdown{display:flex;justify-content:center;gap:8px;margin-top:14px}
.countdown div{background:var(--black);color:#fff;border-radius:10px;min-width:58px;padding:6px 4px;text-align:center}
.countdown span{display:block;font-family:var(--disp);font-size:22px;font-weight:600;line-height:1.1}
.countdown small{font-size:10px;text-transform:uppercase;letter-spacing:.08em;opacity:.7}
.actions{display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.btn{border:0;cursor:pointer;font:600 13px Inter,sans-serif;border-radius:99px;padding:8px 14px;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.primary{background:var(--orange);color:#fff}
.btn.ghost{background:#f1ece6;color:var(--ink)}
.last{display:flex;align-items:center;gap:12px}
.last .score{font-family:var(--disp);font-size:28px;font-weight:700;white-space:nowrap}
.last .txt{flex:1;font-size:14px}
.last .txt small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.form{display:flex;gap:4px;margin-top:10px}
.pill{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;color:#fff;font:700 12px var(--disp)}
.V{background:var(--win)}.N{background:var(--draw)}.P{background:var(--loss)}

/* NAV */
nav{position:sticky;top:0;z-index:10;background:rgba(244,242,239,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);margin-top:20px;border-bottom:1px solid var(--line)}
nav .wrap{display:flex;gap:6px;padding-top:10px;padding-bottom:10px}
nav a{flex:1;text-align:center;text-decoration:none;font-family:var(--disp);font-weight:600;text-transform:uppercase;letter-spacing:.06em;font-size:14px;padding:8px 0;border-radius:10px;color:var(--muted)}
nav a.active{background:var(--black);color:#fff}

section{padding:22px 0 6px}
section h2{font-size:22px;margin-bottom:12px;display:flex;align-items:center;gap:10px}
section h2::before{content:"";width:6px;height:22px;background:var(--orange);border-radius:3px}

/* MATCH LIST */
.toggle{display:inline-flex;background:#e9e4dd;border-radius:99px;padding:3px;margin-bottom:12px}
.toggle button{border:0;background:none;font:600 12px Inter;padding:6px 12px;border-radius:99px;cursor:pointer;color:var(--muted)}
.toggle button.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.match{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:10px;background:var(--card);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.match .g{font-family:var(--disp);font-size:13px;color:var(--muted);text-align:center;line-height:1.1}
.match .g b{display:block;font-size:20px;color:var(--ink)}
.match .opp{font-weight:600;font-size:14px;line-height:1.25}
.match .opp small{display:block;font-weight:400;color:var(--muted);font-size:12px;margin-top:2px}
.tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:4px;padding:1px 5px;margin-right:4px;vertical-align:1px}
.tag.home{background:var(--orange);color:#fff}.tag.away{background:var(--black);color:#fff}
.res{font-family:var(--disp);font-weight:700;font-size:18px;border-radius:8px;padding:4px 10px;color:#fff;min-width:58px;text-align:center}
.res.todo{background:#eee;color:var(--muted);font-size:14px;font-weight:500}
.res.time{background:#f1ece6;color:var(--ink);font-size:14px}
.match.rest{opacity:.7}.match.rest .opp{font-weight:500;color:var(--muted)}
.match.nextup{outline:2px solid var(--orange)}
.round{background:var(--card);border-radius:12px;padding:12px;margin-bottom:10px}
.round h3{font-size:15px;margin-bottom:6px;display:flex;justify-content:space-between}
.round h3 span{font-family:Inter;text-transform:none;letter-spacing:0;font-size:12px;color:var(--muted);font-weight:500}
.rm{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;font-size:13px;padding:7px 0;border-top:1px solid var(--line)}
.rm .h{text-align:right}.rm .sc{font-family:var(--disp);font-weight:600;min-width:52px;text-align:center;color:var(--muted)}
.rm .sc.done{color:var(--ink)}
.rm .us{color:var(--orange-d);font-weight:700}
.rm small{grid-column:1/-1;text-align:center;color:var(--muted);font-size:11px;margin-top:-4px}
.round .riposa{font-size:12px;color:var(--muted);text-align:center;margin-top:6px}

/* ROSTER */
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.player{background:var(--card);border-radius:12px;padding:12px;display:flex;gap:10px;align-items:center}
.player .num{font-family:var(--disp);font-size:26px;font-weight:700;color:var(--orange);width:36px;text-align:center}
.player .nm{font-weight:600;font-size:14px;line-height:1.2}
.player .rl{font-size:12px;color:var(--muted)}
.roster-group{font-family:var(--disp);text-transform:uppercase;letter-spacing:.1em;font-size:13px;color:var(--muted);margin:14px 0 8px}
.empty{background:var(--card);border-radius:12px;padding:20px;text-align:center;color:var(--muted);font-size:14px}

/* TABLE */
.tablewrap{background:var(--card);border-radius:12px;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;padding:10px 6px;text-align:center}
th:nth-child(2){text-align:left}
td{padding:9px 6px;text-align:center;border-top:1px solid var(--line)}
td:nth-child(2){text-align:left;font-weight:500}
td.pts{font-family:var(--disp);font-weight:700;font-size:15px}
td.pos{font-family:var(--disp);color:var(--muted)}
tr.us td{background:#fff3ea}
tr.us td:nth-child(2){color:var(--orange-d);font-weight:700}
tr.us td.pos{box-shadow:inset 4px 0 0 var(--orange);color:var(--orange-d)}
.note{font-size:12px;color:var(--muted);margin-top:8px}
@media (max-width:420px){.hide-s{display:none}}

/* TABELLINO + LOCANDINA */
.click{cursor:pointer;transition:box-shadow .15s}
.click:hover,.click:focus-visible{box-shadow:0 2px 12px rgba(0,0,0,.1);outline:none}
.tbl-hint{color:var(--orange-d);font-weight:600}
.rm.click:hover{background:#faf7f3}
dialog.modal{border:0;border-radius:20px;padding:0;width:min(560px,calc(100% - 24px));max-height:calc(100dvh - 24px);margin:auto;overflow-x:hidden;background:var(--bg);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.4)}
dialog.modal::backdrop{background:rgba(0,0,0,.6)}
.mhead{padding:18px 18px 0}
.mhead h3{font-size:22px;line-height:1.1}
.mhead p{font-size:13px;color:var(--muted);margin-top:4px}
.mbody{padding:14px 18px 6px}
.board{background:var(--black);color:#fff;border-radius:14px;padding:18px 10px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;text-align:center;position:relative;overflow:hidden}
.board::before{content:"";position:absolute;inset:-20% -30% -20% 70%;background:var(--orange);transform:skewX(-24deg);opacity:.9}
.board>*{position:relative}
.board .bt{display:flex;flex-direction:column;align-items:center;gap:8px;font-family:var(--disp);font-weight:600;font-size:14px;text-transform:uppercase;line-height:1.15}
.board .bs{font-family:var(--disp);font-size:44px;font-weight:700;white-space:nowrap;line-height:1}
.board .bs small{display:block;font-size:12px;letter-spacing:.14em;margin-top:6px;color:var(--orange)}
.badge{width:60px;height:60px;border-radius:50%;background:#fff;display:grid;place-items:center;overflow:hidden;flex:none;box-shadow:0 0 0 3px var(--orange);font-family:var(--disp);font-weight:700;font-size:22px}
.badge img{width:88%;height:88%;object-fit:contain}
.badge.us img{width:100%;height:100%;object-fit:cover}
.badge.ini{background:#2a2a2a;color:#fff}
.badge.sm{width:24px;height:24px;font-size:10px;box-shadow:0 0 0 1px var(--line)}
.badge.md{width:44px;height:44px;font-size:16px;box-shadow:0 0 0 2px var(--orange)}
.tteam{display:inline-flex;align-items:center;gap:8px}
.lrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.lrow:first-child{border-top:0}
.lrow .ln{flex:1;font-weight:600;font-size:14px;min-width:0}
.lrow .xbtn{width:40px;height:36px;flex:none}
.lrow label.btn{cursor:pointer}
.ok{color:var(--win);font-size:13px;margin-top:8px}
.tsec{margin-top:16px}
.tsec .label{margin-bottom:6px}
.trow{display:flex;align-items:center;gap:10px;font-size:15px;padding:3px 0}
.trow .n{font-family:var(--disp);font-weight:700;color:var(--muted);min-width:24px;text-align:right}
.trow .x{margin-left:auto;font-weight:700;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:4px 10px;font-size:13px}
.nil{color:var(--muted);font-size:14px}
.mfoot{display:flex;gap:8px;justify-content:flex-end;padding:14px 18px 18px;flex-wrap:wrap;position:sticky;bottom:0;background:var(--bg);border-radius:0 0 20px 20px}
.btn.dark{background:var(--black);color:#fff}
.poster{width:100%;height:auto;display:block;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,.2);aspect-ratio:4/5;background:#111}

/* GIOCATORI / STATISTICHE */
.leaders{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.leader{background:var(--card);border-radius:12px;padding:12px 14px;min-width:0}
.leader b{display:block;font-family:var(--disp);font-size:19px;font-weight:600;line-height:1.15;margin-top:4px;overflow-wrap:anywhere}
.leader small{color:var(--muted);font-size:12px}
@media (max-width:560px){.leaders{grid-template-columns:1fr}.leader{display:flex;align-items:baseline;gap:10px}.leader b{margin:0;font-size:17px}.leader .label{min-width:120px}.leader small{margin-left:auto;white-space:nowrap}}
.stats th button{all:unset;cursor:pointer}
.stats th.on{color:var(--orange-d)}
.stats td.num{font-family:var(--disp);font-weight:700;color:var(--orange);font-size:16px}
.stats td.nm small{display:block;color:var(--muted);font-size:11px;font-weight:400}
.stats td.hl{font-weight:700}
.stats tr.out td{color:var(--muted)}

/* STAFF */
.staffbtn{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.6);cursor:pointer;font-family:Inter,sans-serif}
.staffbar{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:#fff3ea;border:1px dashed var(--orange);border-radius:12px;padding:8px 12px;margin-bottom:12px;font-size:13px}
.fld{display:block;margin-top:14px}
.fld>span{display:block;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--orange-d);margin-bottom:6px}
.modal input,.modal select,.modal textarea{font:inherit;font-size:16px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;width:100%;color:var(--ink);min-width:0}
.erow{display:grid;grid-template-columns:1fr 64px 40px;gap:6px;margin-bottom:6px}
.pcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px;margin-bottom:8px;display:grid;grid-template-columns:64px 1fr 1fr 40px;gap:6px}
.pcard [name=nome]{grid-column:2/4}.pcard select{grid-column:1/3}.pcard .note-in{grid-column:3/5}
.xbtn{border:0;background:#f1ece6;border-radius:10px;cursor:pointer;font-size:15px;color:var(--ink)}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{display:inline-flex;gap:6px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:99px;padding:5px 10px;font-size:13px;cursor:pointer;user-select:none}
.modal .checks input{width:auto;margin:0;accent-color:var(--orange)}
.checks label:has(input:checked){background:var(--orange);color:#fff;border-color:var(--orange)}
.score-in{display:grid;grid-template-columns:1fr 64px auto 64px 1fr;gap:8px;align-items:center;font-size:13px;font-weight:600}
.score-in input{text-align:center}
.score-in span:last-child{text-align:left}.score-in span:first-child{text-align:right}
.err{color:var(--loss);font-size:13px;margin-top:8px;min-height:1em}
.hint{font-size:12px;color:var(--muted);margin-top:4px}

footer{margin-top:28px;background:var(--black);color:#ddd;padding:24px 0 calc(24px + env(safe-area-inset-bottom));font-size:13px}
footer a{color:var(--orange)}
footer p+p{margin-top:6px}
</style>
</head>
<body>

<header class="hero">
  <div class="wrap">
    <div class="crest"><img src="media/logo.png" alt="Logo A.S. Luzzogno"></div>
    <div>
      <h1 id="teamName">A.S. Luzzogno</h1>
      <div class="sub" id="sub">Calcio a 7 · CSI VCO</div>
      <span class="since" id="since">DAL 2002</span><a class="ig" id="ig" hidden target="_blank" rel="noopener">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/></svg>Instagram</a><button class="ig staffbtn" id="staffBtn" type="button">Area staff</button>
    </div>
  </div>
</header>

<div class="wrap cards">
  <div class="card next" id="nextCard"><div class="label">Prossima partita</div><p class="note">Caricamento…</p></div>
  <div class="card" id="lastCard" hidden></div>
</div>

<nav><div class="wrap">
  <a href="#partite" class="active">Partite</a>
  <a href="#giocatori">Giocatori</a>
  <a href="#classifica">Classifica</a>
</div></nav>

<main class="wrap">
  <section id="partite">
    <h2>Partite</h2>
    <div id="staffMatch"></div>
    <div class="toggle"><button class="on" data-v="team">Le nostre</button><button data-v="all">Tutto il girone</button></div>
    <div id="matches"></div>
  </section>

  <section id="giocatori">
    <h2>Giocatori</h2>
    <div id="staffRosa"></div>
    <div class="leaders" id="leaders"></div>
    <div id="roster"></div>
  </section>

  <section id="classifica">
    <h2>Classifica</h2>
    <div class="tablewrap"><table>
      <thead><tr><th>#</th><th>Squadra</th><th>Pt</th><th>G</th><th class="hide-s">V</th><th class="hide-s">N</th><th class="hide-s">P</th><th>GF</th><th>GS</th><th>DR</th></tr></thead>
      <tbody id="table"></tbody>
    </table></div>
    <p class="note" id="tableNote"></p>
    <div id="staffLoghi"></div>
  </section>
</main>

<dialog class="modal" id="dlg"></dialog>

<footer><div class="wrap">
  <p><b>A.S. Luzzogno</b> · <span id="fCamp"></span></p>
  <p>Partite in casa: <span id="fHome"></span></p>
  <p>Dati ufficiali: <a id="fCsi" target="_blank" rel="noopener">calendario CSI VCO</a> · <a id="fRes" target="_blank" rel="noopener">risultati e classifiche</a></p>
</div></footer>

<script>
const MESI=['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];
const GIORNI=['dom','lun','mar','mer','gio','ven','sab'];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const title=s=>s.toLowerCase().replace(/(^|[\s.\-'(])([a-zà-ù])/g,(m,a,b)=>a+b.toUpperCase()).replace(/\bAs\b/,'AS').replace(/\bG\.s\./,'G.S.').replace(/U\.f\.o\.b\./,'U.F.O.B.').replace(/\bHe\.sio\b/,'He.Sio').replace(/\bS\.anna\b/,'S.Anna').replace(/\bAdhoc\b/,'AdHoc');
const when=p=>new Date(p.data+'T'+(p.ora||'00:00')+':00');
const fmtDate=d=>`${GIORNI[d.getDay()]} ${d.getDate()} ${MESI[d.getMonth()]}`;
const played=p=>p.gol_casa!==null&&p.gol_casa!==undefined&&p.gol_ospite!==null&&p.gol_ospite!==undefined;
let D, US, BASE;

// 1) dati di base (rosa, info squadra + ultima copia di calendario/classifica)
// 2) poi i dati aggiornati dal sito CSI (/api/csi)
// 3) e rosa + tabellini inseriti dallo staff (/api/staff); se presenti sostituiscono quelli di data.json
fetch('data.json',{cache:'no-cache'}).then(r=>r.json()).then(d=>{D=d;US=d.squadra;
  BASE=JSON.parse(JSON.stringify({rosa:d.rosa||[],tabellini:d.tabellini||{},loghi:d.loghi||{}}));render();
  fetch('/api/csi').then(r=>r.ok?r.json():Promise.reject()).then(live=>{
    if(!live.giornate||!live.giornate.length)return;
    D.giornate=live.giornate;D.classifica=live.classifica;delete D.classificaCsi;D.aggiornato=live.aggiornato;render();
  }).catch(()=>{});
  (isStaff()?api({action:'load'}).then(j=>j.data):fetch('/api/staff').then(r=>r.ok?r.json():Promise.reject()))
    .then(applyStaffData).catch(()=>{});
}).catch(()=>{
  document.getElementById('nextCard').innerHTML='<div class="label">Errore</div><p class="note">Impossibile caricare i dati.</p>';
});

function ourMatches(){
  const out=[];
  D.giornate.forEach(g=>{
    const p=g.partite.find(p=>p.casa===US||p.ospite===US);
    if(p) out.push({g:g.n,...p,home:p.casa===US,opp:p.casa===US?p.ospite:p.casa});
    else if(g.riposa===US) out.push({g:g.n,rest:true,data:g.partite.map(p=>p.data).sort()[0]});
  });
  return out;
}
function outcome(m){
  const us=m.home?m.gol_casa:m.gol_ospite, them=m.home?m.gol_ospite:m.gol_casa;
  return us>them?'V':us<them?'P':'N';
}

function applyStaffData(s){
  if(!s)return;
  if(Array.isArray(s.rosa))D.rosa=s.rosa;
  if(s.tabellini&&typeof s.tabellini==='object')D.tabellini=s.tabellini;
  if(s.risultati&&typeof s.risultati==='object')D.risultati=s.risultati;
  if(s.loghi&&typeof s.loghi==='object')D.loghi={...BASE.loghi,...s.loghi};
  render();
}
// I risultati inseriti dallo staff hanno la precedenza su quelli del CSI.
// p.csi conserva il risultato ufficiale, p.staff indica che il punteggio mostrato viene dallo staff.
const resKey=p=>`${p.casa}|${p.ospite}`;
function staffResult(p,gn){
  const r=(D.risultati||{})[resKey(p)];
  if(r&&Number.isInteger(r.gol_casa)&&Number.isInteger(r.gol_ospite))return r;
  // vecchio formato: risultato dentro il tabellino (solo partite nostre)
  const t=(p.casa===US||p.ospite===US)?(D.tabellini||{})[gn]:null;
  return t&&Number.isInteger(t.gol_casa)&&Number.isInteger(t.gol_ospite)?t:null;
}
function applyManual(){
  let changed=false;
  D.giornate.forEach(g=>g.partite.forEach(p=>{
    if(p.csi){p.gol_casa=p.csi[0];p.gol_ospite=p.csi[1];}
    else p.csi=[p.gol_casa??null,p.gol_ospite??null];
    delete p.staff;
    const r=staffResult(p,g.n);
    if(r){p.gol_casa=r.gol_casa;p.gol_ospite=r.gol_ospite;p.staff=true;
      if(p.csi[0]!==r.gol_casa||p.csi[1]!==r.gol_ospite)changed=true;}
  }));
  // se lo staff ha cambiato/aggiunto risultati, la classifica si ricalcola dai risultati
  if(changed){if(!D.classificaCsi)D.classificaCsi=D.classifica;D.classifica={...calcClassifica(D.giornate),staff:true};}
  else if(D.classificaCsi){D.classifica=D.classificaCsi;delete D.classificaCsi;}
}
// stessa regola della funzione csi.mjs: 3 punti vittoria, 1 pareggio; spareggi media DR, poi media GF
function calcClassifica(G){
  const T=new Map();
  const row=s=>T.get(s)??T.set(s,{squadra:s,punti:0,giocate:0,v:0,n:0,p:0,gf:0,gs:0}).get(s);
  let ultima=0;
  G.forEach(g=>{
    g.partite.forEach(x=>{
      const a=row(x.casa),b=row(x.ospite);
      if(!played(x))return;
      ultima=Math.max(ultima,g.n);
      a.giocate++;b.giocate++;a.gf+=x.gol_casa;a.gs+=x.gol_ospite;b.gf+=x.gol_ospite;b.gs+=x.gol_casa;
      if(x.gol_casa>x.gol_ospite){a.v++;b.p++;a.punti+=3;}
      else if(x.gol_casa<x.gol_ospite){b.v++;a.p++;b.punti+=3;}
      else{a.n++;b.n++;a.punti++;b.punti++;}
    });
    if(g.riposa)row(g.riposa);
  });
  const avg=(x,y)=>y?x/y:0;
  return {aggiornata_alla_giornata:ultima,righe:[...T.values()].sort((a,b)=>b.punti-a.punti||
    avg(b.gf-b.gs,b.giocate)-avg(a.gf-a.gs,a.giocate)||avg(b.gf,b.giocate)-avg(a.gf,a.giocate)||a.squadra.localeCompare(b.squadra))};
}

/* ================= GIOCATORI: statistiche dai tabellini ================= */
const STAFF_ROLES=['Allenatore','Dirigente'];
const isAutogol=n=>/^autogol/i.test(n);
function playerStats(){
  const S=new Map(), k=n=>String(n).trim().toLowerCase();
  const get=n=>{const key=k(n);if(!S.has(key)){const r=(D.rosa||[]).find(p=>k(p.nome)===key);
    S.set(key,{nome:r?.nome||String(n).trim(),numero:r?.numero,ruolo:r?.ruolo,note:r?.note,inRosa:!!r,pres:0,gol:0,ass:0,gs:null});}return S.get(key);};
  (D.rosa||[]).filter(p=>!STAFF_ROLES.includes(p.ruolo)).forEach(p=>get(p.nome));
  let nTab=0;
  ourMatches().filter(m=>!m.rest&&played(m)).forEach(m=>{
    const T=tabOf(m); if(!T.t)return; nTab++;
    const seen=new Map(T.pres.map(p=>[k(p.nome),p.nome]));
    T.marc.forEach(([n,x])=>{if(isAutogol(n))return;get(n).gol+=x;seen.set(k(n),n);});
    T.ass.forEach(([n,x])=>{if(isAutogol(n))return;get(n).ass+=x;seen.set(k(n),n);});
    T.port.forEach(p=>{const s=get(p.nome);s.gs=(s.gs||0)+(+p.subiti||0);seen.set(k(p.nome),p.nome);});
    seen.forEach(n=>get(n).pres++);
  });
  return {rows:[...S.values()].filter(p=>p.inRosa||p.pres),nTab};
}
let sortBy='gol';

    <tbody>${rows.map(p=>`<tr class="${p.inRosa?'':'out'}"><td class="num">${p.numero??''}</td>
      <td class="nm">${esc(p.nome)}<small>${esc(p.inRosa?[p.ruolo,p.note].filter(Boolean).join(' · '):'Non più in rosa')}</small></td>
      <td>${p.pres}</td><td class="hl">${p.gol}</td><td>${p.ass}</td><td class="hide-s">${p.ga}</td><td>${p.gs??''}</td></tr>`).join('')}</tbody>
  </table></div>
  <p class="note">${nTab?`Statistiche calcolate da ${nTab} ${nTab===1?'tabellino':'tabellini'}.`:'Le statistiche compariranno quando lo staff inserirà i tabellini delle partite.'} GS = gol subiti (portieri). Tocca un'intestazione per ordinare.</p>
  ${staff.length?`<div class="roster-group">Staff</div><div class="roster">${staff.map(p=>`<div class="player"><div><div class="nm">${esc(p.nome)}</div><div class="rl">${esc([p.ruolo,p.note].filter(Boolean).join(' · '))}</div></div></div>`).join('')}</div>`:''}`;
}

const GIORNI_L=['domenica','lunedì','martedì','mercoledì','giovedì','venerdì','sabato'];
const MESI_L=['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
const fmtLong=d=>`${GIORNI_L[d.getDay()]} ${d.getDate()} ${MESI_L[d.getMonth()]}`;

const logoOf=n=>n===US?'media/logo.png':((D.loghi||{})[n]||'');
// iniziali di riserva quando manca il logo: salta sigle tipo AS, G.S., FC
function initials(n){
  const w=n.split(/\s+/).filter(x=>!/^(a\.?s\.?d?\.?|g\.?s\.?|f\.?c\.?|u\.?s\.?|a\.?c\.?)$/i.test(x));
  const t=(w.length>1?w[0][0]+w[1][0]:(w[0]||n).replace(/[^\p{L}]/gu,'').slice(0,2)).toUpperCase();
  return t.replace(/[^\p{L}]/gu,'');
}
function badgeHtml(n,size=''){
  const u=logoOf(n), ini=initials(n);
  return u?`<span class="badge ${size} ${n===US?'us':''}"><img src="${esc(u)}" alt="" loading="lazy" onerror="this.parentNode.classList.add('ini');this.parentNode.textContent='${ini}'"></span>`
          :`<span class="badge ${size} ini">${ini}</span>`;
}
const numOf=nome=>(D.rosa||[]).find(p=>p.nome.toLowerCase()===String(nome).trim().toLowerCase())?.numero;
// "Nome", "Nome x2", "Nome (2)" o {"nome":"Nome","gol":2} -> [[nome, quanti], ...]
function counts(list){
  const m=new Map();
  (list||[]).forEach(x=>{
    let nome,k=1;
    if(x&&typeof x==='object'){nome=x.nome;k=+(x.gol??x.n??1)||1;}
    else{const r=String(x).match(/^(.*?)\s*(?:[x×]\s*(\d+)|\((\d+)\))$/i);nome=r?r[1]:String(x);k=r?+(r[2]||r[3]):1;}
    nome=String(nome).trim(); if(nome) m.set(nome,(m.get(nome)||0)+k);
  });
  return [...m];
}
function matchByG(g){return ourMatches().find(m=>!m.rest&&m.g===+g);}
function tabOf(m){
  const t=(D.tabellini||{})[m.g]||null, us=m.home?m.gol_casa:m.gol_ospite, them=m.home?m.gol_ospite:m.gol_casa;
  if(!t) return {t:null,us,them};
  let P=t.portieri??t.portiere??[]; if(!Array.isArray(P))P=[P];
  P=P.filter(Boolean).map(x=>typeof x==='object'?{...x}:{nome:x});
  if(P.length===1&&P[0].subiti==null)P[0].subiti=them;
  return {t,us,them,marc:counts(t.marcatori),ass:counts(t.assist),port:P,pres:(t.presenti||[]).map(n=>({nome:n,num:numOf(n)}))};
}
const numSpan=n=>`<span class="n">${numOf(n)??''}</span>`;

function openTabellino(g){
  const m=matchByG(g); if(!m||(!played(m)&&!isStaff()))return;
  const pl=played(m), h=m.home?US:m.opp, a=m.home?m.opp:US, d=when(m), T=tabOf(m), o=pl?outcome(m):null;
  let body;
  if(!pl) body=`<p class="nil" style="margin-top:14px">Risultato non ancora disponibile. Puoi inserirlo da “Modifica tabellino”.</p>`;
  else if(!T.t) body=`<p class="nil" style="margin-top:14px">Il tabellino di questa partita non è ancora stato inserito.</p>`;
  else{
    const marc=T.marc.length?T.marc.map(([n,k])=>`<div class="trow">${numSpan(n)}<span>${esc(n)}</span>${k>1?`<span class="x">×${k}</span>`:''}</div>`).join('')
      :`<p class="nil">${T.us?'Non indicati':'Nessuno'}</p>`;
    const ass=T.ass.length?T.ass.map(([n,k])=>`<div class="trow">${numSpan(n)}<span>${esc(n)}</span>${k>1?`<span class="x">×${k}</span>`:''}</div>`).join(''):'<p class="nil">Nessuno</p>';

    const pres=[...T.pres].sort((x,y)=>(x.num??999)-(y.num??999)||x.nome.localeCompare(y.nome));

const loadImg=src=>new Promise(res=>{if(!src)return res(null);const i=new Image();if(/^https?:/.test(src))i.crossOrigin='anonymous';i.onload=()=>res(i);i.onerror=()=>res(null);i.src=src;});

function wrapLines(x,text,maxW,maxLines){
  const words=text.split(' '),lines=[];let cur='';
  words.forEach(w=>{const t=cur?cur+' '+w:w;if(x.measureText(t).width>maxW&&cur){lines.push(cur);cur=w;}else cur=t;});
  if(cur)lines.push(cur);
  if(lines.length>maxLines){lines.length=maxLines;let l=lines[maxLines-1];while(x.measureText(l+'…').width>maxW&&l.length>1)l=l.slice(0,-1);lines[maxLines-1]=l+'…';}
  return lines;
}
function fitFont(x,text,weight,size,family,maxW,min=20){
  do{x.font=`${weight} ${size}px ${family}`;}while(x.measureText(text).width>maxW&&(size-=2)>min);
}

function drawBadge(x,cx,cy,r,name,img){
  const us=name===US;
  x.beginPath();x.arc(cx,cy,r+12,0,Math.PI*2);x.fillStyle='#E8742A';x.fill();
  x.save();x.beginPath();x.arc(cx,cy,r,0,Math.PI*2);x.clip();
  if(img){
    x.fillStyle='#fff';x.fillRect(cx-r,cy-r,2*r,2*r);
    const s=us?Math.max(2*r/img.width,2*r/img.height):Math.min(2*r/img.width,2*r/img.height)*0.86;
    x.drawImage(img,cx-img.width*s/2,cy-img.height*s/2,img.width*s,img.height*s);
  }else{
    x.fillStyle='#2a2a2a';x.fillRect(cx-r,cy-r,2*r,2*r);
    x.fillStyle='#fff';x.font=`700 ${r*0.8}px Oswald`;x.textAlign='center';x.textBaseline='middle';
    x.fillText(initials(name),cx,cy+r*0.04);x.textBaseline='alphabetic';
  }
  x.restore();
}

async function drawPoster(m){
  const W=1080,H=1350,c=document.createElement('canvas');c.width=W;c.height=H;
  const x=c.getContext('2d');
  await Promise.all(['700 100px Oswald','600 40px Oswald','500 36px Inter','600 36px Inter'].map(f=>document.fonts.load(f).catch(()=>{})));
  const h=m.home?US:m.opp,a=m.home?m.opp:US,o=outcome(m),d=when(m),T=tabOf(m);
  const ls=v=>{if('letterSpacing' in x)x.letterSpacing=v;};

  // sfondo: nero con fascia arancione obliqua (come la testata del sito)
  x.fillStyle='#111';x.fillRect(0,0,W,H);
  const sk=H*Math.tan(24*Math.PI/180);
  const band=(x0,x1,alpha,maxY=H)=>{x.save();x.globalAlpha=alpha;x.fillStyle='#E8742A';x.beginPath();
    x.rect(0,0,W,maxY);x.clip();x.beginPath();
    x.moveTo(x0,0);x.lineTo(x1,0);x.lineTo(x1-sk,H);x.lineTo(x0-sk,H);x.closePath();x.fill();x.restore();};
  band(W*.55,W*1.12,.16);       // fascia larga trasparente
  band(W*1.04,W*1.1,.9,560);    // filetto pieno, solo nell'angolo in alto a destra
  // bordino a strisce in basso
  for(let i=0;i<W;i+=60){x.fillStyle='#E8742A';x.fillRect(i,H-16,48,16);x.fillStyle='#fff';x.fillRect(i+48,H-16,12,16);}

  x.textAlign='center';
  // intestazione
  ls('4px');x.fillStyle='#E8742A';
  fitFont(x,`${m.g}ª GIORNATA · ${D.campionato.replace(/^Calcio a 7 · /i,'').toUpperCase()}`,600,34,'Oswald',W-140);
  x.fillText(`${m.g}ª GIORNATA · ${D.campionato.replace(/^Calcio a 7 · /i,'').toUpperCase()}`,W/2,100);
  ls('2px');x.fillStyle='#fff';x.font='700 128px Oswald';
  x.fillText({V:'VITTORIA!',N:'PAREGGIO',P:'RISULTATO'}[o],W/2,240);

  // stemmi + nomi
  const [li,lh,la]=await Promise.all([loadImg(logoOf(US)),loadImg(logoOf(h)),loadImg(logoOf(a))]);
  const imgOf=n=>n===US?li:(n===h?lh:la);
  [[h,W*.27],[a,W*.73]].forEach(([n,cx])=>{
    drawBadge(x,cx,440,140,n,imgOf(n));
    ls('1px');x.font='600 42px Oswald';x.fillStyle=n===US?'#E8742A':'#fff';
    wrapLines(x,title(n).toUpperCase(),440,2).forEach((l,i)=>x.fillText(l,cx,660+i*48));
  });

  // punteggio
  ls('0px');x.fillStyle='#fff';x.font='700 240px Oswald';
  x.fillText(`${m.gol_casa} – ${m.gol_ospite}`,W/2,960);
  x.fillStyle='#E8742A';x.fillRect(W/2-70,1000,140,8);

  // data, ora, campo
  ls('2px');x.fillStyle='#fff';x.font='600 58px Oswald';
  x.fillText(fmtLong(d).toUpperCase(),W/2,1080);
  ls('0px');x.font='500 36px Inter';x.fillStyle='#cfcac4';
  x.fillText(`ore ${m.ora} · ${title(m.campo)}`,W/2,1132);

  // marcatori
  let y=1196;
  if(T.t&&T.marc.length){
    const txt='⚽ '+T.marc.map(([n,k])=>k>1?`${n} ×${k}`:n).join(', ');
    x.font='600 32px Inter';x.fillStyle='#fff';
    const L=wrapLines(x,txt,W-160,2);
    L.forEach((l,i)=>x.fillText(l,W/2,y+i*40));
    y+=(L.length-1)*40;
  }
  ls('3px');x.fillStyle='#E8742A';x.font='700 50px Oswald';
  x.fillText(`FORZA ${title(US).replace(/^AS /i,'').toUpperCase()}`,W/2,Math.max(y+76,1272));
  return c;
}

async function openPoster(g){
  const m=matchByG(g); if(!m||!played(m))return;
  dlg.innerHTML=`<div class="mhead"><h3>Locandina ${m.g}ª giornata</h3><p>Salvala e pubblicala sui social o nel gruppo della squadra.</p></div>

// Campi risultato (usati da tabellino e da "risultato altre partite")
function scoreFields(p){
  return `<div class="fld"><span>Risultato</span><div class="score-in"><span>${esc(title(p.casa))}</span>
    <input type="number" name="gc" min="0" max="99" inputmode="numeric" value="${played(p)?p.gol_casa:''}"><b>–</b>
    <input type="number" name="go" min="0" max="99" inputmode="numeric" value="${played(p)?p.gol_ospite:''}"><span>${esc(title(p.ospite))}</span></div></div>`;
}
// -> {risultato:{casa,ospite,gol_casa,gol_ospite}} (gol null = torna al CSI), shown=[gc,go] punteggio finale
function readScore(f,p){
  const gc=f.gc.value.trim(),go=f.go.value.trim();
  if((gc==='')!==(go===''))return {error:'Inserisci entrambi i gol del risultato (o lasciali vuoti).'};
  const cs=p.csi&&p.csi[0]!=null?p.csi:null;
  const same=gc!==''&&cs&&+gc===cs[0]&&+go===cs[1];
  const risultato={casa:p.casa,ospite:p.ospite,gol_casa:gc===''||same?null:+gc,gol_ospite:go===''||same?null:+go};
  return {risultato,shown:gc!==''?[+gc,+go]:cs};
}
function openRisultato(ref){
  const [gn,i]=ref.split(':').map(Number), g=D.giornate.find(x=>x.n===gn), p=g?.partite[i]; if(!p)return;

    <div class="mfoot"><button class="btn ghost" data-close>Annulla</button><button class="btn primary" id="sSave">Salva risultato</button></div>`;

  document.getElementById('sSave').onclick=async e=>{

    if(sc.error){document.getElementById('sErr').textContent=sc.error;return;}
    btn.disabled=true;btn.textContent='Salvataggio…';
    try{const j=await api({action:'saveRisultato',risultato:sc.risultato,base:BASE});dlg.close();applyStaffData(j.data);}
    catch(x){apiError(x,'sErr');btn.disabled=false;btn.textContent='Salva risultato';}
  };
}

function editTabellino(g){
  const m=matchByG(g); if(!m)return;
  const h=m.home?US:m.opp, a=m.home?m.opp:US, t=(D.tabellini||{})[g]||{}, T=tabOf(m);
  const players=(D.rosa||[]).filter(p=>!STAFF_ROLES.includes(p.ruolo)).sort((x,y)=>(x.numero??999)-(y.numero??999)||x.nome.localeCompare(y.nome));
  const label=p=>`${p.numero!=null?p.numero+' · ':''}${esc(p.nome)}`;
  const opts=(sel,autogol)=>{
    const known=players.some(p=>p.nome===sel);
    return `<option value="">— scegli —</option>${players.map(p=>`<option value="${esc(p.nome)}" ${p.nome===sel?'selected':''}>${label(p)}</option>`).join('')}
      ${sel&&!known&&!isAutogol(sel)?`<option selected value="${esc(sel)}">${esc(sel)}</option>`:''}${autogol?`<option value="Autogol" ${isAutogol(sel||'')?'selected':''}>Autogol (avversario)</option>`:''}`;
  };
  const erow=(kind,nome='',n='')=>`<div class="erow" data-kind="${kind}"><select>${opts(nome,kind==='marc')}</select>
    <input type="number" min="0" max="99" value="${n}" aria-label="${kind==='port'?'Gol subiti':'Quanti'}" placeholder="${kind==='port'?'subiti':'n.'}"><button type="button" class="xbtn" data-del title="Rimuovi">✕</button></div>`;
  const marc=T.t?T.marc:[], ass=T.t?T.ass:[], port=T.t?T.port:[];
  const pres=new Set((T.t?T.pres:[]).map(p=>p.nome.toLowerCase()));
  dlg.innerHTML=`<div class="mhead"><h3>Tabellino · ${m.g}ª giornata</h3><p>${esc(title(h))} – ${esc(title(a))} · ${fmtLong(when(m))}</p></div>
  <div class="mbody"><form id="tf" onsubmit="return false">
    ${scoreFields(m)}
    <div class="fld"><span>Presenti</span>${players.length?`<div class="checks">${players.map(p=>`<label><input type="checkbox" name="pres" value="${esc(p.nome)}" ${pres.has(p.nome.toLowerCase())?'checked':''}>${label(p)}</label>`).join('')}</div>`:'<p class="nil">Prima inserisci la rosa.</p>'}
      <p class="hint">Marcatori, assist e portieri vengono contati presenti anche se non spuntati.</p></div>
    <div class="fld"><span>Marcatori ${esc(D.nome_esteso)}</span><div id="e-marc">${marc.map(([n,k])=>erow('marc',n,k)).join('')}</div><button type="button" class="btn ghost" data-add-row="marc">+ Marcatore</button></div>
    <div class="fld"><span>Assist</span><div id="e-ass">${ass.map(([n,k])=>erow('ass',n,k)).join('')}</div><button type="button" class="btn ghost" data-add-row="ass">+ Assist</button></div>
    <div class="fld"><span>In porta (gol subiti)</span><div id="e-port">${port.map(p=>erow('port',p.nome,p.subiti??'')).join('')}</div><button type="button" class="btn ghost" data-add-row="port">+ Portiere</button></div>
    <label class="fld"><span>Note</span><textarea name="note" rows="2" maxlength="300">${esc(t.note||'')}</textarea></label>
    <p class="err" id="tErr"></p>
  </form></div>
  <div class="mfoot"><button class="btn ghost" data-tab="${m.g}">Annulla</button><button class="btn primary" id="tSave">Salva tabellino</button></div>`;
  if(!dlg.open)dlg.showModal();
  dlg._erow=erow; dlg.scrollTop=0;
  document.getElementById('tSave').onclick=async e=>{
    const btn=e.currentTarget, f=document.getElementById('tf'), err=document.getElementById('tErr'); err.textContent='';
    const rows=k=>[...dlg.querySelectorAll(`.erow[data-kind=${k}]`)].map(r=>({nome:r.querySelector('select').value,n:r.querySelector('input').value})).filter(r=>r.nome);
    const marcatori=rows('marc').map(r=>({nome:r.nome,gol:+r.n||1}));
    const assist=rows('ass').map(r=>({nome:r.nome,n:+r.n||1}));
    const portieri=rows('port').map(r=>({nome:r.nome,subiti:r.n===''?null:+r.n}));
    const presenti=[...new Set([...f.querySelectorAll('[name=pres]:checked')].map(i=>i.value)
      .concat(marcatori.map(x=>x.nome),assist.map(x=>x.nome),portieri.map(x=>x.nome)).filter(n=>!isAutogol(n)))];
    const tab={marcatori,assist,portieri,presenti,note:f.note.value.trim()};
    const sc=readScore(f,m); if(sc.error){err.textContent=sc.error;return;}
    const us=sc.shown?(m.home?sc.shown[0]:sc.shown[1]):null;
    const tot=marcatori.reduce((s,x)=>s+x.gol,0);
    if(us!=null&&tot>us){err.textContent=`I marcatori sommano ${tot} gol ma la squadra ne ha segnati ${us}.`;return;}
    btn.disabled=true;btn.textContent='Salvataggio…';
    try{const j=await api({action:'saveTabellino',g:m.g,tabellino:tab,risultato:sc.risultato,base:BASE});applyStaffData(j.data);openTabellino(m.g);}
    catch(x){apiError(x,'tErr');btn.disabled=false;btn.textContent='Salva tabellino';}
  };
}

function editLoghi(msg=''){
  const teams=[...new Set([...(D.classifica?.righe||[]).map(r=>r.squadra),...D.giornate.flatMap(g=>g.partite.flatMap(p=>[p.casa,p.ospite]))])]
    .filter(n=>n&&n!==US).sort((a,b)=>title(a).localeCompare(title(b)));
  dlg.innerHTML=`<div class="mhead"><h3>Loghi squadre</h3><p>Carica un'immagine (PNG, JPG, WebP): viene ridimensionata da sola. Compare in tabellini, locandine e classifica.</p></div>
    <div class="mbody">${teams.map(n=>{const u=(D.loghi||{})[n]||'';
      return `<div class="lrow">${badgeHtml(n,'md')}<span class="ln">${esc(title(n))}</span>
        <label class="btn ghost">${u?'Cambia':'Carica'}<input type="file" accept="image/png,image/jpeg,image/webp" hidden data-logo-file="${esc(n)}"></label>
        ${u.startsWith('/api/logo/')?`<button type="button" class="xbtn" data-logo-del="${esc(n)}" title="Rimuovi logo">✕</button>`:''}</div>`;}).join('')}
      <p class="${msg.startsWith('!')?'err':'ok'}" id="gMsg">${esc(msg.replace(/^!/,''))}</p></div>
    <div class="mfoot"><button class="btn primary" data-close>Fatto</button></div>`;
  if(!dlg.open)dlg.showModal();
}
// ridimensiona a max 256 px e ricodifica in PNG (così il file è piccolo e "pulito")
function resizeLogo(file){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file), img=new Image();
    img.onload=()=>{const s=Math.min(1,256/Math.max(img.width,img.height));
      const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*s));c.height=Math.max(1,Math.round(img.height*s));
      const x=c.getContext('2d');x.imageSmoothingQuality='high';x.drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c.toDataURL('image/png'));};
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('Immagine non leggibile'));};
    img.src=url;
  });
}
document.addEventListener('change',async e=>{
  const inp=e.target.closest?.('[data-logo-file]'); if(!inp||!inp.files[0])return;
  const n=inp.dataset.logoFile, msg=document.getElementById('gMsg');
  msg.className='hint';msg.textContent=`Caricamento logo ${title(n)}…`;
  try{const image=await resizeLogo(inp.files[0]);
    const j=await api({action:'saveLogo',squadra:n,image,base:BASE});applyStaffData(j.data);editLoghi(`Logo di ${title(n)} aggiornato.`);}
  catch(x){if(x.status)apiError(x,'gMsg');else{msg.className='err';msg.textContent=x.message;}}
});

document.addEventListener('click',e=>{
  const c=k=>e.target.closest(k);
  let el;
  if(c('[data-edit-loghi]')){editLoghi();return;}
  if((el=c('[data-logo-del]'))){const n=el.dataset.logoDel;if(!confirm(`Rimuovere il logo di ${title(n)}?`))return;
    api({action:'deleteLogo',squadra:n,base:BASE}).then(j=>{applyStaffData(j.data);editLoghi(`Logo di ${title(n)} rimosso.`);}).catch(x=>apiError(x,'gMsg'));return;}
  if((el=c('[data-res]'))){openRisultato(el.dataset.res);return;}
  if((el=c('[data-poster]'))){openPoster(el.dataset.poster);return;}
  if((el=c('[data-edit-tab]'))){editTabellino(el.dataset.editTab);return;}
  if(c('[data-edit-rosa]')){editRosa();return;}
  if(c('[data-add-player]')){document.getElementById('pList').insertAdjacentHTML('beforeend',pcard());
    dlg.querySelector('.pcard:last-child [name=nome]').focus();return;}
  if((el=c('[data-add-row]'))){const k=el.dataset.addRow;document.getElementById('e-'+k).insertAdjacentHTML('beforeend',dlg._erow(k,'',k==='port'?'':1));return;}
  if((el=c('[data-del]'))){el.parentNode.remove();return;}
  if((el=c('[data-tab]'))){openTabellino(el.dataset.tab);}
});
document.addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ')&&e.target.matches?.('[data-tab][role=button],[data-res][role=button]')){e.preventDefault();e.target.click();}
});

// nav highlight
const links=[...document.querySelectorAll('nav a')];
const obs=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)links.forEach(l=>l.classList.toggle('active',l.getAttribute('href')==='#'+e.target.id));}),{rootMargin:'-40% 0px -55% 0px'});
document.querySelectorAll('section').forEach(s=>obs.observe(s));
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
