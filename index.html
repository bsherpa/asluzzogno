<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A.S. Luzzogno · Calcio a 7</title>
<meta name="description" content="A.S. Luzzogno – calendario, risultati, rosa e classifica del campionato CSI VCO calcio a 7.">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AS Luzzogno">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="media/icon-192.png">
<link rel="apple-touch-icon" href="media/icon-180.png">
<meta property="og:title" content="A.S. Luzzogno">
<meta property="og:description" content="Calendario, risultati e classifica – CSI VCO calcio a 7">
<meta property="og:image" content="media/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --orange:#E8742A; --orange-d:#C95E1C; --black:#111; --ink:#1b1b1b;
  --bg:#f4f2ef; --card:#fff; --muted:#6f6a64; --line:#e6e1da;
  --win:#1f9d55; --draw:#9a8f84; --loss:#d64545;
  --r:16px; --disp:Oswald,'Arial Narrow','Roboto Condensed',Inter,system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:64px}
body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.4}
a{color:inherit}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
h1,h2,h3,.oswald{font-family:var(--disp);letter-spacing:.02em;text-transform:uppercase}

/* HERO */
.hero{background:var(--black);color:#fff;position:relative;overflow:hidden;padding:calc(env(safe-area-inset-top) + 28px) 0 64px}
.hero::before{content:"";position:absolute;inset:auto -20% -40% 35%;height:140%;background:var(--orange);transform:skewX(-24deg);opacity:.95}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:6px;background:repeating-linear-gradient(90deg,var(--orange) 0 24px,#fff 24px 30px)}
.hero .wrap{position:relative;display:flex;align-items:center;gap:18px}
.crest{width:104px;height:104px;border-radius:50%;background:#fff;flex:none;box-shadow:0 8px 24px rgba(0,0,0,.35);padding:4px}
.crest img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.hero h1{font-size:32px;line-height:1;font-weight:700}
.hero .sub{margin-top:8px;font-size:13px;opacity:.9;font-weight:500}
.hero .since{display:inline-block;margin-top:10px;font-family:var(--disp);font-size:12px;letter-spacing:.2em;border:1px solid rgba(255,255,255,.5);border-radius:99px;padding:3px 10px}
.ig{display:inline-flex;align-items:center;gap:6px;margin:10px 0 0 6px;font-size:12px;font-weight:600;text-decoration:none;background:#fff;color:var(--black);border-radius:99px;padding:4px 10px}
.ig[hidden]{display:none}

/* CARDS */
.cards{margin-top:-40px;position:relative;display:grid;gap:12px}
.card{background:var(--card);border-radius:var(--r);box-shadow:0 2px 14px rgba(0,0,0,.07);padding:16px}
.label{font-family:var(--disp);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--orange-d);font-weight:600}
.next .teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin:12px 0 10px;text-align:center}
.next .team{font-family:var(--disp);font-weight:600;font-size:17px;line-height:1.15;text-transform:uppercase}
.next .team.us{color:var(--orange-d)}
.next .vs{font-family:var(--disp);color:var(--muted);font-size:14px}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);justify-content:center}
.meta b{color:var(--ink);font-weight:600}
.countdown{display:flex;justify-content:center;gap:8px;margin-top:14px}
.countdown div{background:var(--black);color:#fff;border-radius:10px;min-width:58px;padding:6px 4px;text-align:center}
.countdown span{display:block;font-family:var(--disp);font-size:22px;font-weight:600;line-height:1.1}
.countdown small{font-size:10px;text-transform:uppercase;letter-spacing:.08em;opacity:.7}
.actions{display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.btn{border:0;cursor:pointer;font:600 13px Inter,sans-serif;border-radius:99px;padding:8px 14px;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.primary{background:var(--orange);color:#fff}
.btn.ghost{background:#f1ece6;color:var(--ink)}
.last{display:flex;align-items:center;gap:12px}
.last .score{font-family:var(--disp);font-size:28px;font-weight:700;white-space:nowrap}
.last .txt{flex:1;font-size:14px}
.last .txt small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.form{display:flex;gap:4px;margin-top:10px}
.pill{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;color:#fff;font:700 12px var(--disp)}
.V{background:var(--win)}.N{background:var(--draw)}.P{background:var(--loss)}

/* NAV */
nav{position:sticky;top:0;z-index:10;background:rgba(244,242,239,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);margin-top:20px;border-bottom:1px solid var(--line)}
nav .wrap{display:flex;gap:6px;padding-top:10px;padding-bottom:10px}
nav a{flex:1;text-align:center;text-decoration:none;font-family:var(--disp);font-weight:600;text-transform:uppercase;letter-spacing:.06em;font-size:14px;padding:8px 0;border-radius:10px;color:var(--muted)}
nav a.active{background:var(--black);color:#fff}

section{padding:22px 0 6px}
section h2{font-size:22px;margin-bottom:12px;display:flex;align-items:center;gap:10px}
section h2::before{content:"";width:6px;height:22px;background:var(--orange);border-radius:3px}

/* MATCH LIST */
.toggle{display:inline-flex;background:#e9e4dd;border-radius:99px;padding:3px;margin-bottom:12px}
.toggle button{border:0;background:none;font:600 12px Inter;padding:6px 12px;border-radius:99px;cursor:pointer;color:var(--muted)}
.toggle button.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.match{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:10px;background:var(--card);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.match .g{font-family:var(--disp);font-size:13px;color:var(--muted);text-align:center;line-height:1.1}
.match .g b{display:block;font-size:20px;color:var(--ink)}
.match .opp{font-weight:600;font-size:14px;line-height:1.25}
.match .opp small{display:block;font-weight:400;color:var(--muted);font-size:12px;margin-top:2px}
.tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:4px;padding:1px 5px;margin-right:4px;vertical-align:1px}
.tag.home{background:var(--orange);color:#fff}.tag.away{background:var(--black);color:#fff}
.res{font-family:var(--disp);font-weight:700;font-size:18px;border-radius:8px;padding:4px 10px;color:#fff;min-width:58px;text-align:center}
.res.todo{background:#eee;color:var(--muted);font-size:14px;font-weight:500}
.res.time{background:#f1ece6;color:var(--ink);font-size:14px}
.match.rest{opacity:.7}.match.rest .opp{font-weight:500;color:var(--muted)}
.match.nextup{outline:2px solid var(--orange)}
.round{background:var(--card);border-radius:12px;padding:12px;margin-bottom:10px}
.round h3{font-size:15px;margin-bottom:6px;display:flex;justify-content:space-between}
.round h3 span{font-family:Inter;text-transform:none;letter-spacing:0;font-size:12px;color:var(--muted);font-weight:500}
.rm{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;font-size:13px;padding:7px 0;border-top:1px solid var(--line)}
.rm .h{text-align:right}.rm .sc{font-family:var(--disp);font-weight:600;min-width:52px;text-align:center;color:var(--muted)}
.rm .sc.done{color:var(--ink)}
.rm .us{color:var(--orange-d);font-weight:700}
.rm small{grid-column:1/-1;text-align:center;color:var(--muted);font-size:11px;margin-top:-4px}
.round .riposa{font-size:12px;color:var(--muted);text-align:center;margin-top:6px}

/* ROSTER */
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.player{background:var(--card);border-radius:12px;padding:12px;display:flex;gap:10px;align-items:center}
.player .num{font-family:var(--disp);font-size:26px;font-weight:700;color:var(--orange);width:36px;text-align:center}
.player .nm{font-weight:600;font-size:14px;line-height:1.2}
.player .rl{font-size:12px;color:var(--muted)}
.roster-group{font-family:var(--disp);text-transform:uppercase;letter-spacing:.1em;font-size:13px;color:var(--muted);margin:14px 0 8px}
.empty{background:var(--card);border-radius:12px;padding:20px;text-align:center;color:var(--muted);font-size:14px}

/* TABLE */
.tablewrap{background:var(--card);border-radius:12px;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;padding:10px 6px;text-align:center}
th:nth-child(2){text-align:left}
td{padding:9px 6px;text-align:center;border-top:1px solid var(--line)}
td:nth-child(2){text-align:left;font-weight:500}
td.pts{font-family:var(--disp);font-weight:700;font-size:15px}
td.pos{font-family:var(--disp);color:var(--muted)}
tr.us td{background:#fff3ea}
tr.us td:nth-child(2){color:var(--orange-d);font-weight:700}
tr.us td.pos{box-shadow:inset 4px 0 0 var(--orange);color:var(--orange-d)}
.note{font-size:12px;color:var(--muted);margin-top:8px}
@media (max-width:420px){.hide-s{display:none}}

footer{margin-top:28px;background:var(--black);color:#ddd;padding:24px 0 calc(24px + env(safe-area-inset-bottom));font-size:13px}
footer a{color:var(--orange)}
footer p+p{margin-top:6px}
</style>
</head>
<body>

<header class="hero">
  <div class="wrap">
    <div class="crest"><img src="media/logo.png" alt="Logo A.S. Luzzogno"></div>
    <div>
      <h1 id="teamName">A.S. Luzzogno</h1>
      <div class="sub" id="sub">Calcio a 7 · CSI VCO</div>
      <span class="since" id="since">DAL 2002</span><a class="ig" id="ig" hidden target="_blank" rel="noopener">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/></svg>Instagram</a>
    </div>
  </div>
</header>

<div class="wrap cards">
  <div class="card next" id="nextCard"><div class="label">Prossima partita</div><p class="note">Caricamento…</p></div>
  <div class="card" id="lastCard" hidden></div>
</div>

<nav><div class="wrap">
  <a href="#partite" class="active">Partite</a>
  <a href="#rosa">Rosa</a>
  <a href="#classifica">Classifica</a>
</div></nav>

<main class="wrap">
  <section id="partite">
    <h2>Partite</h2>
    <div class="toggle"><button class="on" data-v="team">Le nostre</button><button data-v="all">Tutto il girone</button></div>
    <div id="matches"></div>
  </section>

  <section id="rosa">
    <h2>Rosa</h2>
    <div id="roster"></div>
  </section>

  <section id="classifica">
    <h2>Classifica</h2>
    <div class="tablewrap"><table>
      <thead><tr><th>#</th><th>Squadra</th><th>Pt</th><th>G</th><th class="hide-s">V</th><th class="hide-s">N</th><th class="hide-s">P</th><th>GF</th><th>GS</th><th>DR</th></tr></thead>
      <tbody id="table"></tbody>
    </table></div>
    <p class="note" id="tableNote"></p>
  </section>
</main>

<footer><div class="wrap">
  <p><b>A.S. Luzzogno</b> · <span id="fCamp"></span></p>
  <p>Partite in casa: <span id="fHome"></span></p>
  <p>Dati ufficiali: <a id="fCsi" target="_blank" rel="noopener">calendario CSI VCO</a> · <a id="fRes" target="_blank" rel="noopener">risultati e classifiche</a></p>
</div></footer>

<script>
const MESI=['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];
const GIORNI=['dom','lun','mar','mer','gio','ven','sab'];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const title=s=>s.toLowerCase().replace(/(^|[\s.\-'(])([a-zà-ù])/g,(m,a,b)=>a+b.toUpperCase()).replace(/\bAs\b/,'AS').replace(/\bG\.s\./,'G.S.').replace(/U\.f\.o\.b\./,'U.F.O.B.').replace(/\bHe\.sio\b/,'He.Sio').replace(/\bS\.anna\b/,'S.Anna').replace(/\bAdhoc\b/,'AdHoc');
const when=p=>new Date(p.data+'T'+(p.ora||'00:00')+':00');
const fmtDate=d=>`${GIORNI[d.getDay()]} ${d.getDate()} ${MESI[d.getMonth()]}`;
const played=p=>p.gol_casa!==null&&p.gol_casa!==undefined&&p.gol_ospite!==null&&p.gol_ospite!==undefined;
let D, US;

// 1) dati di base (rosa, info squadra + ultima copia di calendario/classifica)
// 2) poi prova i dati aggiornati dal sito CSI tramite la funzione /api/csi
fetch('data.json',{cache:'no-cache'}).then(r=>r.json()).then(d=>{D=d;US=d.squadra;render();
  fetch('/api/csi').then(r=>r.ok?r.json():Promise.reject()).then(live=>{
    if(!live.giornate||!live.giornate.length)return;
    D.giornate=live.giornate;D.classifica=live.classifica;D.aggiornato=live.aggiornato;render();
  }).catch(()=>{});
}).catch(()=>{
  document.getElementById('nextCard').innerHTML='<div class="label">Errore</div><p class="note">Impossibile caricare i dati.</p>';
});

function ourMatches(){
  const out=[];
  D.giornate.forEach(g=>{
    const p=g.partite.find(p=>p.casa===US||p.ospite===US);
    if(p) out.push({g:g.n,...p,home:p.casa===US,opp:p.casa===US?p.ospite:p.casa});
    else if(g.riposa===US) out.push({g:g.n,rest:true,data:g.partite.map(p=>p.data).sort()[0]});
  });
  return out;
}
function outcome(m){
  const us=m.home?m.gol_casa:m.gol_ospite, them=m.home?m.gol_ospite:m.gol_casa;
  return us>them?'V':us<them?'P':'N';
}

function render(){
  document.title=`${D.nome_esteso} · Calcio a 7`;
  document.getElementById('teamName').textContent=D.nome_esteso;
  document.getElementById('sub').textContent=`${D.campionato} · ${D.stagione}`;
  document.getElementById('since').textContent=`DAL ${D.fondazione}`;
  if(D.instagram){const ig=document.getElementById('ig');ig.href=D.instagram;ig.hidden=false;}
  document.getElementById('fCamp').textContent=`${D.campionato} · ${D.stagione}`;
  document.getElementById('fHome').textContent=D.campo_casa;
  document.getElementById('fCsi').href=D.link_calendario_csi;
  document.getElementById('fRes').href=D.link_risultati_csi;

  const ms=ourMatches(), now=new Date();
  const games=ms.filter(m=>!m.rest);
  const next=games.find(m=>!played(m)&&when(m).getTime()+2*3600e3>now);
  const done=games.filter(played);
  renderNext(next, ms, now);
  renderLast(done);
  renderMatches(ms,next);
  renderRoster();
  renderTable();
}

function renderNext(m, ms, now){
  const el=document.getElementById('nextCard');
  if(!m){el.innerHTML='<div class="label">Prossima partita</div><p class="note" style="text-align:center;margin-top:10px">Stagione regolare conclusa. Ci vediamo alla prossima!</p>';return;}
  const d=when(m);
  const rest=ms.find(x=>x.rest&&new Date(x.data)>=new Date(now.toDateString())&&new Date(x.data)<d);
  const h=m.home?US:m.opp, a=m.home?m.opp:US;
  el.innerHTML=`<div class="label">Prossima partita · ${m.g}ª giornata</div>
    <div class="teams"><div class="team ${h===US?'us':''}">${esc(title(h))}</div><div class="vs">VS</div><div class="team ${a===US?'us':''}">${esc(title(a))}</div></div>
    <div class="meta"><span><b>${fmtDate(d)}</b> ore <b>${m.ora}</b></span><span>📍 ${esc(title(m.campo))}</span><span>${m.home?'In casa':'In trasferta'}</span></div>
    <div class="countdown" id="cd"></div>
    <div class="actions">
      <a class="btn primary" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(m.campo.replace(/ - CAMPO$/,' campo sportivo')+' VCO')}" target="_blank" rel="noopener">Indicazioni</a>
      <button class="btn ghost" id="ics">Aggiungi al calendario</button>
    </div>
    ${rest?`<p class="note" style="text-align:center">Turno di riposo nella ${rest.g}ª giornata.</p>`:''}`;
  const cd=document.getElementById('cd');
  const tick=()=>{let s=Math.max(0,(d-new Date())/1000);
    if(s<=0){cd.innerHTML='<div style="min-width:auto;padding:6px 14px"><span style="font-size:16px">SI GIOCA!</span></div>';return;}
    const g=Math.floor(s/86400),o=Math.floor(s%86400/3600),mi=Math.floor(s%3600/60);
    cd.innerHTML=`<div><span>${g}</span><small>giorni</small></div><div><span>${o}</span><small>ore</small></div><div><span>${mi}</span><small>min</small></div>`;};
  tick();setInterval(tick,30000);
  document.getElementById('ics').onclick=()=>downloadIcs(m,d,h,a);
}

function downloadIcs(m,d,h,a){
  const p=n=>String(n).padStart(2,'0');
  const f=x=>`${x.getFullYear()}${p(x.getMonth()+1)}${p(x.getDate())}T${p(x.getHours())}${p(x.getMinutes())}00`;
  const end=new Date(d.getTime()+90*60e3);
  const ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//AS Luzzogno//IT','BEGIN:VEVENT',
    `UID:luzzogno-${m.data}-${m.g}@asluzzogno`,`DTSTART;TZID=Europe/Rome:${f(d)}`,`DTEND;TZID=Europe/Rome:${f(end)}`,
    `SUMMARY:${title(h)} - ${title(a)}`,`LOCATION:${title(m.campo)}`,`DESCRIPTION:${D.campionato} - ${m.g}ª giornata`,'END:VEVENT','END:VCALENDAR'].join('\r\n');
  const url=URL.createObjectURL(new Blob([ics],{type:'text/calendar'}));
  const l=document.createElement('a');l.href=url;l.download=`luzzogno-${m.g}a-giornata.ics`;l.click();
}

function renderLast(done){
  const el=document.getElementById('lastCard');
  if(!done.length)return;
  const m=done[done.length-1], o=outcome(m);
  const h=m.home?US:m.opp, a=m.home?m.opp:US;
  const form=done.slice(-5).map(x=>`<div class="pill ${outcome(x)}" title="${esc(title(x.opp))}">${outcome(x)}</div>`).join('');
  el.hidden=false;
  el.innerHTML=`<div class="label">Ultimo risultato · ${m.g}ª giornata</div>
    <div class="last" style="margin-top:8px"><div class="pill ${o}" style="width:32px;height:32px;font-size:15px">${o}</div>
    <div class="txt">${esc(title(h))} – ${esc(title(a))}<small>${fmtDate(when(m))} · ${esc(title(m.campo))}</small></div>
    <div class="score">${m.gol_casa} - ${m.gol_ospite}</div></div>
    ${done.length>1?`<div class="form">${form}</div>`:''}`;
}

let view='team';
document.querySelectorAll('.toggle button').forEach(b=>b.onclick=()=>{
  view=b.dataset.v;document.querySelectorAll('.toggle button').forEach(x=>x.classList.toggle('on',x===b));render();});

function renderMatches(ms,next){
  const el=document.getElementById('matches');
  if(view==='all'){
    el.innerHTML=D.giornate.map(g=>{
      const dates=[...new Set(g.partite.map(p=>p.data))].sort();
      return `<div class="round"><h3>${g.n}ª giornata <span>${dates.map(x=>fmtDate(new Date(x+'T12:00'))).join(' / ')}</span></h3>
      ${g.partite.map(p=>`<div class="rm"><div class="h ${p.casa===US?'us':''}">${esc(title(p.casa))}</div>
        <div class="sc ${played(p)?'done':''}">${played(p)?`${p.gol_casa} - ${p.gol_ospite}`:p.ora}</div>
        <div class="${p.ospite===US?'us':''}">${esc(title(p.ospite))}</div>
        <small>${fmtDate(when(p))} · ${esc(title(p.campo))}</small></div>`).join('')}
      ${g.riposa?`<div class="riposa">Riposa: ${esc(title(g.riposa))}</div>`:''}</div>`;}).join('');
    return;
  }
  const now=new Date();
  el.innerHTML=ms.map(m=>{
    if(m.rest) return `<div class="match rest"><div class="g"><b>${m.g}</b>giorn.</div><div class="opp">Turno di riposo</div><div></div></div>`;
    const d=when(m); let r;
    if(played(m)){const o=outcome(m);r=`<div class="res ${o}">${m.gol_casa} - ${m.gol_ospite}</div>`;}
    else if(d<now) r=`<div class="res todo">n.d.</div>`;
    else r=`<div class="res time">${m.ora}</div>`;
    return `<div class="match ${m===next?'nextup':''}"><div class="g"><b>${m.g}</b>giorn.</div>
      <div class="opp"><span class="tag ${m.home?'home':'away'}">${m.home?'Casa':'Trasf.'}</span>${esc(title(m.opp))}
      <small>${fmtDate(d)} · ${esc(title(m.campo))}</small></div>${r}</div>`;
  }).join('');
}

function renderRoster(){
  const el=document.getElementById('roster');
  const R=D.rosa||[];
  if(!R.length){el.innerHTML='<div class="empty">La rosa 2026/27 sarà pubblicata a breve.</div>';return;}
  const order=['Portiere','Difensore','Centrocampista','Attaccante','Staff','Allenatore','Dirigente'];
  const groups={};R.forEach(p=>(groups[p.ruolo||'Giocatori']??=[]).push(p));
  const keys=Object.keys(groups).sort((a,b)=>(order.indexOf(a)+99)%99-(order.indexOf(b)+99)%99);
  const plural={Portiere:'Portieri',Difensore:'Difensori',Centrocampista:'Centrocampisti',Attaccante:'Attaccanti',Allenatore:'Allenatori',Dirigente:'Dirigenti'};
  el.innerHTML=keys.map(k=>`<div class="roster-group">${plural[k]||k}</div><div class="roster">${
    groups[k].sort((a,b)=>(a.numero??999)-(b.numero??999)).map(p=>`<div class="player">${p.numero!=null?`<div class="num">${p.numero}</div>`:''}<div><div class="nm">${esc(p.nome)}</div>${p.note?`<div class="rl">${esc(p.note)}</div>`:''}</div></div>`).join('')
  }</div>`).join('');
}

function renderTable(){
  const rows=D.classifica.righe; // ordine come da sito CSI
  document.getElementById('table').innerHTML=rows.map((r,i)=>{const dr=r.gf-r.gs;
    return `<tr class="${r.squadra===US?'us':''}"><td class="pos">${i+1}</td><td>${esc(title(r.squadra))}</td><td class="pts">${r.punti}</td><td>${r.giocate}</td><td class="hide-s">${r.v}</td><td class="hide-s">${r.n}</td><td class="hide-s">${r.p}</td><td>${r.gf}</td><td>${r.gs}</td><td>${dr>0?'+':''}${dr}</td></tr>`;}).join('');
  const agg=D.aggiornato?` · dati CSI letti il ${new Date(D.aggiornato).toLocaleString('it-IT',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}`:'';
  document.getElementById('tableNote').textContent=`Aggiornata alla ${D.classifica.aggiornata_alla_giornata}ª giornata${agg}. In caso di discrepanze fa fede il sito CSI VCO.`;
}

// nav highlight
const links=[...document.querySelectorAll('nav a')];
const obs=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)links.forEach(l=>l.classList.toggle('active',l.getAttribute('href')==='#'+e.target.id));}),{rootMargin:'-40% 0px -55% 0px'});
document.querySelectorAll('section').forEach(s=>obs.observe(s));
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
